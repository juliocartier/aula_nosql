version: '3.8'
services:
  # --- ENCONTRO 1: REDIS ---
  redis-aula:
    image: redis:alpine
    container_name: redis-aula
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Garante que salve no disco
    networks:
      - rede-aula
  # --- ENCONTRO 2: MONGODB ---
  mongo-aula:
    image: mongo:latest
    container_name: mongo-aula
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rede-aula

# -------------------------------------------------------
  # 3. APACHE CASSANDRA (Wide-Column)
  # -------------------------------------------------------
  cassandra-aula:
    image: cassandra:latest
    container_name: cassandra-aula
    ports:
      - "9042:9042"
    volumes:
      # AQUI ESTÁ O VOLUME CORRETO PARA O CASSANDRA
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=AulaCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    networks:
      - rede-aula
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ] || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
  # -------------------------------------------------------
  # 4. NEO4J (Grafos)
  # -------------------------------------------------------
  neo4j-aula:
    image: neo4j:latest
    container_name: neo4j-aula
    ports:
      - "7474:7474" # HTTP (Interface Visual no Navegador)
      - "7687:7687" # Bolt (Protocolo para o Python conectar)
    volumes:
      - neo4j_data:/data
    environment:
      # Define usuário e senha direto (evita pedir troca no 1º login)
      - NEO4J_AUTH=neo4j/aluno123
      # Limite de memória para não pesar o PC do aluno
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    networks:
      - rede-aula
volumes:
  redis_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
networks:
  rede-aula:
    driver: bridge